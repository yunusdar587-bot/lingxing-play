<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>四站利润排行榜</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <!-- 配置页：每次打开网页都先进入这里 -->
  <div id="config-view" class="view">
    <header class="topbar">
      <div class="brand">
        <h1>排行榜配置</h1>
        <span class="sub" id="cfg-sub">加载中…</span>
      </div>
      <button class="btn ghost" id="cfg-reload">刷新状态</button>
    </header>

    <main class="config">
      <div id="cfg-sign" class="banner hidden"></div>

      <section class="card" id="sec-ready">
        <h2><span class="step">1</span>数据是否就绪</h2>
        <p class="hint">选入排行榜的店铺必须已有「本店今天」的快照。</p>
        <table class="list" id="ready-table"></table>
      </section>

      <section class="card" id="sec-q">
        <h2><span class="step">2</span>退货率 <span class="counter" id="q-counter"></span></h2>
        <p class="hint">领星查不到退货率的 MSKU。每条选择「按 0 计入」或填写百分数，并勾选「已核对」。未选入任何列的店铺可不处理。</p>
        <table class="list" id="q-table"></table>
      </section>

      <section class="card" id="sec-dims">
        <h2><span class="step">3</span>尺寸来源 <span class="sub">只展示</span></h2>
        <div id="dims-body"></div>
        <label class="ack"><input type="checkbox" id="ack-dims"> 已查看</label>
      </section>

      <section class="card" id="sec-lots">
        <h2><span class="step">4</span>开账未知批次 <span class="sub">只展示</span></h2>
        <div id="lots-body"></div>
        <label class="ack"><input type="checkbox" id="ack-lots"> 已查看</label>
      </section>

      <section class="card" id="sec-cols">
        <h2><span class="step">5</span>三列与仓储口径</h2>
        <div class="mode-pick" id="mode-pick"></div>
        <div class="col-grid" id="col-grid"></div>
      </section>

      <section class="card price-card" id="sec-price"></section>

      <div class="confirm-bar">
        <ul class="problems" id="problems"></ul>
        <button class="btn primary" id="confirm-btn">确认并进入排行榜</button>
      </div>
    </main>
  </div>

  <!-- 排行榜 -->
  <div id="board-view" class="view hidden">
    <header class="topbar">
      <div class="brand">
        <h1>四站利润排行榜</h1>
        <span class="mode-tag" id="board-mode"></span>
        <span class="sub" id="board-sub"></span>
      </div>
      <button class="btn ghost" id="exit-btn">退出</button>
    </header>
    <div id="board-banner" class="banner hidden"></div>
    <main class="board" id="board"></main>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
