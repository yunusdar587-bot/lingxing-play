<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>四站当日调整后利润看板</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <h1>四站当日调整后利润</h1>
      <span class="sub" id="generated">加载中…</span>
    </div>
    <div class="mode-switch" role="tablist" aria-label="仓储模式">
      <button data-mode="daily" class="active" role="tab">今日已过时段的在库仓储</button>
      <button data-mode="order" role="tab">今日已售出件数的在仓仓储</button>
    </div>
  </header>

  <div id="sign-banner" class="banner hidden"></div>

  <main class="layout">
    <section class="col-main">
      <div class="total-card card">
        <div class="total-head">
          <span class="label" id="total-label">全部店铺人民币合计（各店「本店今天」相加）</span>
          <span class="mode-tag" id="total-mode"></span>
        </div>
        <div class="total-value" id="total-value">—</div>
        <details class="store-pick" id="store-pick">
          <summary id="store-pick-summary">参与合计的店铺</summary>
          <div class="total-tz" id="total-tz"></div>
        </details>
      </div>

      <details class="card" id="history-card">
        <summary>历史数据</summary>
        <div class="history-body">
          <div class="history-form">
            <label>开始 <input id="hist-start" type="datetime-local" step="900"></label>
            <label>结束 <input id="hist-end" type="datetime-local" step="900"></label>
            <button class="btn" id="hist-load" type="button">拉取</button>
          </div>
          <div class="sub" id="hist-note">按各店自己的时区，只返回库里已留存的 15 分钟刻度。</div>
          <div id="hist-result"></div>
        </div>
      </details>

      <div class="stores" id="stores"></div>

      <div class="card detail hidden" id="detail">
        <div class="detail-head">
          <div>
            <h2 id="detail-title"></h2>
            <div class="sub" id="detail-sub"></div>
          </div>
          <div class="detail-kpi">
            <div class="kpi-label">调整后毛利</div>
            <div class="kpi-value" id="detail-adjusted">—</div>
            <div class="sub" id="detail-margin"></div>
          </div>
        </div>

        <div class="grid-2">
          <div>
            <h3>利润构成：原毛利 → 调整后毛利</h3>
            <table class="waterfall" id="waterfall"></table>
            <div class="sub" id="waterfall-note"></div>
          </div>
          <div>
            <h3>仍留在毛利中的费用 <span class="sub">（接口原值，已含在原毛利里）</span></h3>
            <table class="retained" id="retained"></table>
            <h3 class="mt">今日日内曲线 <span class="sub">（每次轮询的调整后毛利）</span></h3>
            <div id="curve" class="curve"></div>
          </div>
        </div>

        <h3 class="mt">MSKU 明细</h3>
        <div class="table-wrap">
          <table class="msku" id="msku-table"></table>
        </div>
      </div>
    </section>

    <aside class="col-side">
      <div class="card">
        <h3>价目表版本</h3>
        <div id="price"></div>
      </div>
      <details class="card" id="notice-card">
        <summary>提示</summary>
        <ul class="notices" id="notices"></ul>
      </details>
      <details class="card">
        <summary>轮询记录</summary>
        <table class="mini" id="polls"></table>
      </details>
      <details class="card">
        <summary>队列与数据异常</summary>
        <ul class="mini-list" id="anomalies"></ul>
      </details>
    </aside>
  </main>
  <script src="/static/app.js"></script>
</body>
</html>
